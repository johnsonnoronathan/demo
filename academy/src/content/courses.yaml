- id: performance-testing
  order: 2
  level: intermediate
  title: Performance Testing
  tagline: Find what makes software slow before your users do.
  summary: >-
    Learn to test a web application's performance from both sides. Static testing inspects
    code, queries and assets without running anything. Dynamic testing runs the system,
    puts traffic through it and measures what users feel. You practise both on Larkspur
    Books, a small bookshop app that is slow on purpose.
  audience: >-
    Developers and testers who can read JavaScript and SQL and use a terminal. No previous
    performance testing experience needed.
  prerequisites:
    - Node.js 22.13 or later
    - A terminal and a code editor
    - Chrome, for Lighthouse and the CPU profiler
    - k6 for chapter 3 (the course also includes a built-in fallback load tool)
  outcomes:
    - Turn "it should be fast" into measurable budgets and thresholds
    - Find N+1 queries, missing indexes and heavy assets by reading code, plans and builds
    - Measure page load in the lab with Lighthouse and read Core Web Vitals
    - Write and run load, stress, spike and soak tests with k6
    - Locate a CPU bottleneck in a flame graph and prove the fix
    - Put static and dynamic checks into CI, and report results people can act on
    - Run an acceptance test against agreed criteria and record a go/no-go decision
    - Apply the static checks to your own project, with an agent implementing the fixes
  practice:
    name: Larkspur Books
    path: academy/practice/larkspur
    summary: A Node.js 22 bookshop with a storefront and three JSON endpoints over SQLite. No dependencies. Slow on purpose.
    setup:
      - cd academy/practice/larkspur
      - npm run seed
      - "npm start   # leave it running in its own terminal; http://localhost:3000"
  chapters:
    - id: overview
      title: Overview
      role: overall
      summary: What performance testing measures, the two families of tests, and the practice app.
    - id: static
      title: Static testing
      role: specific
      summary: Find performance problems by inspecting what you built, without running it.
    - id: dynamic
      title: Dynamic testing
      role: specific
      summary: Run the system, put traffic through it and measure what users feel.
    - id: review
      title: Summary
      role: overall
      summary: Combine both into a workflow, report the results, run acceptance, apply it to your own project, and review the whole course.
- id: test-cases
  order: 1
  level: beginner
  title: Writing Test Cases
  tagline: Write test cases anyone can run, and that find bugs.
  summary: >-
    The foundations of testing in six short lessons. Learn what a test case is and what
    makes one trustworthy, choose inputs with partitions and boundaries, cover the unhappy
    paths, turn a written case into an automated test, and keep a growing suite healthy.
  audience: >-
    Anyone who tests software or wants to: developers, testers, product people. No
    previous testing experience needed; lesson 3.1 reads a little JavaScript.
  prerequisites:
    - Curiosity about how software breaks
    - Node.js, only if you want to run lesson 3.1's tests yourself
  outcomes:
    - Read, write and run a test case by hand
    - Rewrite vague test cases into specific, repeatable ones
    - Choose test inputs with equivalence partitions and boundary values
    - Cover negative cases and use decision tables to find gaps
    - Turn a test case into an automated test with Arrange, Act, Assert
    - Organise a suite with the test pyramid and a traceability matrix
  chapters:
    - id: foundations
      title: Foundations
      summary: What a test case is, and what separates a good one from a weak one.
    - id: design
      title: Designing test cases
      summary: Choose which cases to write with partitions, boundaries and decision tables.
    - id: automation
      title: Automating and scaling
      summary: Turn cases into code, then organise a suite that people trust.
