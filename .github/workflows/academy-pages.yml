name: Publish academy

# Rebuilds the site and publishes it to the gh-pages branch, which GitHub Pages serves at
# https://johnsonnoronathan.github.io/demo/. Runs when main changes, after the same checks.
on:
  push:
    branches: [main]
    paths: ["academy/**", ".github/workflows/academy-*.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: academy-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: academy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: academy/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Publish dist/ to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Publish Testbench site from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
